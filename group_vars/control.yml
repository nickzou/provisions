ansible_connection: local
ansible_python_interpreter: /usr/bin/python3
shell_user: root
user_home: /root
dotfiles_dir: "{{ user_home }}/server-dotfiles"

# Web hosting (web.yml)
server_hostname: parthica
deploy_user: deploy
# Public half of the GitHub Actions deploy key; the private half is a repo secret.
deploy_ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAHMZaG8Bi8TS7DDZnL5qbrQzLPx5SqsoK+Kaqwh/r5G github-actions-deploy@nick-zou"
# Each app gets /srv/<name> (deploy-owned) and /var/backups/<name>.
web_apps:
  - nick-zou
  - twilight-of-steel
traefik_version: v3.7.19
# Optional: set to register the Let's Encrypt account with an email address.
traefik_acme_email: ""
