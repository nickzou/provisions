---

- name: Ansible control node
  hosts: control
  become: false

  vars:
    control_packages:
      - zsh
      - tmux
      - neovim
      - git
      - stow
      - ripgrep
      - fd-find
      - fzf
      - bat
      - zoxide
      - lsd
      - build-essential
      - fastfetch
      - lazygit
      - git-delta
      - curl
      - unzip
      - nodejs
      - npm
      - golang-go
      - acl
      - gh
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin

    hunk_version: 0.24.1
    lazydocker_version: 0.25.2

  tasks:
    - name: System setup
      become: true
      block:
        - name: Add GitHub CLI apt repository
          ansible.builtin.deb822_repository:
            name: github-cli
            types: deb
            uris: https://cli.github.com/packages
            suites: stable
            components: main
            signed_by: https://cli.github.com/packages/githubcli-archive-keyring.gpg
          register: github_cli_repo

        - name: Add Docker apt repository
          ansible.builtin.deb822_repository:
            name: docker
            types: deb
            uris: https://download.docker.com/linux/ubuntu
            suites: "{{ ansible_facts['distribution_release'] }}"
            components: stable
            signed_by: https://download.docker.com/linux/ubuntu/gpg
          register: docker_repo

        - name: Refresh apt cache for new repositories
          ansible.builtin.apt:
            update_cache: true
          when: github_cli_repo.changed or docker_repo.changed

        - name: Install packages
          ansible.builtin.apt:
            name: "{{ control_packages }}"
            state: present
            update_cache: true
            cache_valid_time: 3600

        - name: Link Debian binary names to their usual names
          ansible.builtin.file:
            src: "/usr/bin/{{ item.src }}"
            dest: "/usr/local/bin/{{ item.dest }}"
            state: link
          loop:
            - { src: fdfind, dest: fd }
            - { src: batcat, dest: bat }

        - name: Install starship
          ansible.builtin.shell: curl -sS https://starship.rs/install.sh | sh -s -- -y
          args:
            creates: /usr/local/bin/starship

        - name: Install lazydocker
          ansible.builtin.unarchive:
            src: "https://github.com/jesseduffield/lazydocker/releases/download/v{{ lazydocker_version }}/lazydocker_{{ lazydocker_version }}_Linux_x86_64.tar.gz"
            dest: /usr/local/bin
            remote_src: true
            include: [lazydocker]
            creates: /usr/local/bin/lazydocker

        - name: Install hunk
          ansible.builtin.unarchive:
            src: "https://github.com/modem-dev/hunk/releases/download/v{{ hunk_version }}/hunkdiff-linux-x64.tar.gz"
            dest: /opt
            remote_src: true
            creates: /opt/hunkdiff-linux-x64/hunk

        - name: Link hunk onto PATH
          ansible.builtin.file:
            src: /opt/hunkdiff-linux-x64/hunk
            dest: /usr/local/bin/hunk
            state: link

        - name: Cap Docker container log size
          ansible.builtin.copy:
            dest: /etc/docker/daemon.json
            content: |
              {
                "log-driver": "local"
              }
            mode: "0644"
          notify: Restart Docker

        - name: Start Docker on boot
          ansible.builtin.systemd_service:
            name: docker
            state: started
            enabled: true

        - name: Make zsh the default shell and let the user run docker
          ansible.builtin.user:
            name: "{{ shell_user }}"
            shell: /usr/bin/zsh
            groups: docker
            append: true

    - name: User setup
      become: true
      become_user: "{{ shell_user }}"
      block:
        - name: Clone dotfiles
          ansible.builtin.git:
            repo: https://github.com/nickzou/server-dotfiles.git
            dest: "{{ dotfiles_dir }}"
            version: main
            update: true
            force: true

        - name: Check for default dotfiles that would conflict with stow
          ansible.builtin.stat:
            path: "{{ user_home }}/{{ item }}"
          loop: [.bashrc, .bash_aliases, .zshrc]
          register: default_dotfiles

        - name: Back up default dotfiles so stow can replace them with links
          ansible.builtin.command:
            cmd: mv "{{ item.stat.path }}" "{{ item.stat.path }}.bak"
          loop: "{{ default_dotfiles.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: item.stat.exists and item.stat.isreg

        - name: Stow dotfiles
          ansible.builtin.command:
            cmd: stow --restow {{ item }}
            chdir: "{{ dotfiles_dir }}"
          loop: [zsh, bash, nvim, tmux, starship, lsd, lazygit, fastfetch]
          changed_when: false

        - name: Check whether gh is logged in
          ansible.builtin.command: gh auth status
          register: gh_auth
          changed_when: false
          failed_when: false

        - name: Install gh-dash extension
          ansible.builtin.command: gh extension install dlvhdr/gh-dash
          args:
            creates: "{{ user_home }}/.local/share/gh/extensions/gh-dash"
          when: gh_auth.rc == 0

        - name: Install Claude Code
          ansible.builtin.shell: set -o pipefail && curl -fsSL https://claude.ai/install.sh | bash
          args:
            executable: /bin/bash
            creates: "{{ user_home }}/.local/bin/claude"

  handlers:
    - name: Restart Docker
      become: true
      ansible.builtin.systemd_service:
        name: docker
        state: restarted
