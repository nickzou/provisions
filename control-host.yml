---

- name: Ansible control node
  hosts: control
  become: true
  tasks:
    - name: Install control node tools
      ansible.builtin.package:
        - git
        - python3-pip
        - sshpass
      state: present

    - name: Ensure SSH key exists for managing other hosts
      community.crypoto.openssh_keypair:
        path: /root/.ssh/ansible
        type: ed25519
      become: false
